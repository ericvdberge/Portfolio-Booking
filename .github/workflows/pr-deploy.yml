name: PR Preview Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ericvdberge/portfolio-booking/backend
  FRONTEND_IMAGE_NAME: ericvdberge/portfolio-booking/frontend
  RESOURCE_GROUP: BookingSystem-PR
  ENVIRONMENT_TYPE: preview

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
      id-token: write
      pull-requests: write

    outputs:
      frontend_pr_url: ${{ steps.get-urls.outputs.frontend_pr_url }}
      backend_pr_url: ${{ steps.get-urls.outputs.backend_pr_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore .NET tools
        run: dotnet tool restore

      # Build and push Docker images
      - name: Build and push images
        env:
          IMAGE_TAG: pr-${{ github.event.pull_request.number }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet cake --target=Build-Images

      # Azure deployment
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure
        id: get-urls
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          RESOURCE_GROUP: ${{ env.RESOURCE_GROUP }}
          ENVIRONMENT_TYPE: ${{ env.ENVIRONMENT_TYPE }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          IMAGE_TAG: pr-${{ github.event.pull_request.number }}
        run: dotnet cake --target=Deploy-Infra

      # Comment on PR with URLs
      - name: Comment preview URL on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FRONTEND_URL: ${{ steps.get-urls.outputs.frontend_pr_url }}
          BACKEND_URL: ${{ steps.get-urls.outputs.backend_pr_url }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "🚀 **Preview Deployment Ready**
          - **Frontend**: ${FRONTEND_URL}
          - **Backend**: ${BACKEND_URL}

          ---
          *Deployed from commit ${{ github.sha }}*"
